<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 고양이 몸통 -->
  <ellipse cx="100" cy="120" rx="45" ry="55" fill="#FF9F40" stroke="#E67E22" stroke-width="2"/>

  <!-- 고양이 머리 -->
  <circle cx="100" cy="70" r="40" fill="#FF9F40" stroke="#E67E22" stroke-width="2"/>

  <!-- 왼쪽 귀 -->
  <polygon points="75,40 65,15 85,45" fill="#FF9F40" stroke="#E67E22" stroke-width="2"/>
  <polygon points="75,40 70,25 80,42" fill="#FFB366"/>

  <!-- 오른쪽 귀 -->
  <polygon points="125,40 135,15 115,45" fill="#FF9F40" stroke="#E67E22" stroke-width="2"/>
  <polygon points="125,40 130,25 120,42" fill="#FFB366"/>

  <!-- 왼쪽 눈 -->
  <ellipse cx="85" cy="65" rx="8" ry="12" fill="#2C3E50"/>
  <ellipse cx="87" cy="63" rx="3" ry="5" fill="white"/>

  <!-- 오른쪽 눈 -->
  <ellipse cx="115" cy="65" rx="8" ry="12" fill="#2C3E50"/>
  <ellipse cx="117" cy="63" rx="3" ry="5" fill="white"/>

  <!-- 코 -->
  <polygon points="100,75 95,82 105,82" fill="#E74C3C"/>

  <!-- 입 -->
  <path d="M 100 82 Q 95 87 90 85" stroke="#2C3E50" stroke-width="2" fill="none"/>
  <path d="M 100 82 Q 105 87 110 85" stroke="#2C3E50" stroke-width="2" fill="none"/>

  <!-- 수염 왼쪽 -->
  <line x1="60" y1="70" x2="35" y2="65" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="60" y1="75" x2="35" y2="75" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="60" y1="80" x2="35" y2="85" stroke="#2C3E50" stroke-width="1.5"/>

  <!-- 수염 오른쪽 -->
  <line x1="140" y1="70" x2="165" y2="65" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="140" y1="75" x2="165" y2="75" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="140" y1="80" x2="165" y2="85" stroke="#2C3E50" stroke-width="1.5"/>

  <!-- 앞발 왼쪽 -->
  <ellipse cx="75" cy="160" rx="12" ry="25" fill="#FF9F40" stroke="#E67E22" stroke-width="2"/>

  <!-- 앞발 오른쪽 -->
  <ellipse cx="125" cy="160" rx="12" ry="25" fill="#FF9F40" stroke="#E67E22" stroke-width="2"/>

  <!-- 꼬리 -->
  <path d="M 140 130 Q 165 120 170 95 Q 172 80 165 70" stroke="#E67E22" stroke-width="15" fill="none" stroke-linecap="round"/>
  <path d="M 140 130 Q 165 120 170 95 Q 172 80 165 70" stroke="#FF9F40" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- 배 무늬 -->
  <ellipse cx="100" cy="130" rx="20" ry="30" fill="#FFD6A5" opacity="0.6"/>
</svg>
